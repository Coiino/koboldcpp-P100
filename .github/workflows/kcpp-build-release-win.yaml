name: Koboldcpp Windows

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash to build from'
        required: false
        default: ''

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2022
    permissions: write-all
    steps:
      - name: Show runner hardware
        shell: pwsh
        run: |
          Write-Host "::group::GitHub runner"
          Write-Host "Name: $env:RUNNER_NAME"
          Write-Host "OS/architecture: $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "Image: $env:ImageOS $env:ImageVersion"
          Write-Host "::endgroup::"
          Write-Host "::group::Machine and operating system"
          $system = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $system | Select-Object Manufacturer, Model, SystemType, HypervisorPresent, TotalPhysicalMemory | Format-List
          Write-Host ("Installed RAM: {0} bytes ({1:N2} GiB)" -f $system.TotalPhysicalMemory, ($system.TotalPhysicalMemory / 1GB))
          $os | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Write-Host "::endgroup::"
          Write-Host "::group::CPU"
          Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, Description, SocketDesignation, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          Write-Host "::endgroup::"
          Write-Host "::group::Memory modules"
          Get-CimInstance Win32_PhysicalMemory | Select-Object Manufacturer, PartNumber, Capacity, Speed, ConfiguredClockSpeed | Format-List
          Write-Host "::endgroup::"

      - name: Clone
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}

      - name: Show Commit Used
        run: |
          echo "Building from ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}"

      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.8.10

      - name: Apply Tesla P100 sm_60 & NoAVX2 Patches (common.cuh + mmvq.cu + koboldcpp.py)
        shell: python
        run: |
          import difflib, re, sys

          def apply_exact_sub(path, src, pattern, replacement, label, expected=1):
              patched, count = re.subn(pattern, replacement, src, flags=re.MULTILINE)
              if count != expected:
                  print(f"[P100 Patch] ERROR ({label}) in {path}: expected {expected} match(es), got {count}", file=sys.stderr)
                  sys.exit(1)
              return patched

          # 1. common.cuh: 4-instruction PTX vmad dp4a for sm_60
          common_path = "ggml/src/ggml-cuda/common.cuh"
          with open(common_path, "r", encoding="utf-8", newline="") as f:
              common_orig = f.read()

          if "vmad.s32.s32.s32" in common_orig:
              print(f"[P100 Patch] {common_path} already patched, skipping.")
          else:
              common_new = apply_exact_sub(
                  common_path,
                  common_orig,
                  r"(#if\s+__CUDA_ARCH__\s*>=\s*GGML_CUDA_CC_DP4A\s*\|\|\s*defined\(GGML_USE_MUSA\)\r?\n"
                  r"[ \t]*return\s+__dp4a\(a,\s*b,\s*c\);\r?\n)"
                  r"(#else\b)",
                  r"\1"
                  "#elif defined(__CUDA_ARCH__) && __CUDA_ARCH__ == 600\n"
                  "    int res = c;\n"
                  "    asm(\"vmad.s32.s32.s32 %0, %1.b0, %2.b0, %0;\" : \"+r\"(res) : \"r\"(a), \"r\"(b));\n"
                  "    asm(\"vmad.s32.s32.s32 %0, %1.b1, %2.b1, %0;\" : \"+r\"(res) : \"r\"(a), \"r\"(b));\n"
                  "    asm(\"vmad.s32.s32.s32 %0, %1.b2, %2.b2, %0;\" : \"+r\"(res) : \"r\"(a), \"r\"(b));\n"
                  "    asm(\"vmad.s32.s32.s32 %0, %1.b3, %2.b3, %0;\" : \"+r\"(res) : \"r\"(a), \"r\"(b));\n"
                  "    return res;\n"
                  r"\2",
                  "common.cuh vmad dp4a"
              )
              with open(common_path, "w", encoding="utf-8", newline="") as f:
                  f.write(common_new)
              print(f"[P100 Patch] Successfully patched {common_path}.")
              print("".join(difflib.unified_diff(common_orig.splitlines(True), common_new.splitlines(True), fromfile=common_path, tofile=common_path)))

          # 2. mmvq.cu: MMVQ_PARAMETERS_PASCAL (rows_per_block=4/2 for sm_60)
          mmvq_path = "ggml/src/ggml-cuda/mmvq.cu"
          with open(mmvq_path, "r", encoding="utf-8", newline="") as f:
              mmvq_orig = f.read()

          if "MMVQ_PARAMETERS_PASCAL" in mmvq_orig:
              print(f"[P100 Patch] {mmvq_path} already patched, skipping.")
          else:
              mmvq_new = mmvq_orig
              mmvq_new = apply_exact_sub(
                  mmvq_path, mmvq_new,
                  r"(MMVQ_PARAMETERS_GENERIC\s*=\s*0,\r?\n)",
                  r"\1    MMVQ_PARAMETERS_PASCAL,\n",
                  "mmvq enum"
              )
              mmvq_new = apply_exact_sub(
                  mmvq_path, mmvq_new,
                  r"(#elif\s+__CUDA_ARCH__\s*>=\s*GGML_CUDA_CC_VOLTA\s*&&\s*__CUDA_ARCH__\s*<\s*GGML_CUDA_CC_AMPERE)",
                  "#elif __CUDA_ARCH__ == GGML_CUDA_CC_PASCAL\n    return MMVQ_PARAMETERS_PASCAL;\n" + r"\1",
                  "mmvq device table_id"
              )
              mmvq_new = apply_exact_sub(
                  mmvq_path, mmvq_new,
                  r"([ \t]*if\s*\(GGML_CUDA_CC_IS_NVIDIA\(cc\)\s*&&\s*ggml_cuda_highest_compiled_arch\(cc\)\s*>=\s*GGML_CUDA_CC_VOLTA)",
                  "    if (GGML_CUDA_CC_IS_NVIDIA(cc) && ggml_cuda_highest_compiled_arch(cc) == GGML_CUDA_CC_PASCAL) {\n"
                  "        return MMVQ_PARAMETERS_PASCAL;\n"
                  "    }\n" + r"\1",
                  "mmvq host table_id"
              )
              mmvq_new = apply_exact_sub(
                  mmvq_path, mmvq_new,
                  r"if\s*\(table_id\s*==\s*MMVQ_PARAMETERS_GENERIC\)",
                  "if (table_id == MMVQ_PARAMETERS_GENERIC || table_id == MMVQ_PARAMETERS_PASCAL)",
                  "mmvq calc_nwarps"
              )
              mmvq_new = apply_exact_sub(
                  mmvq_path, mmvq_new,
                  r"if\s*\(table_id\s*==\s*MMVQ_PARAMETERS_GENERIC\s*\|\|\s*table_id\s*==\s*MMVQ_PARAMETERS_GCN",
                  "if (table_id == MMVQ_PARAMETERS_GENERIC || table_id == MMVQ_PARAMETERS_PASCAL || table_id == MMVQ_PARAMETERS_GCN",
                  "mmvq calc_rows_per_block cond"
              )
              mmvq_new = apply_exact_sub(
                  mmvq_path, mmvq_new,
                  r"([ \t]*if\s*\(table_id\s*==\s*MMVQ_PARAMETERS_GB10\)\s*\{\r?\n[ \t]*return\s+type\s*==\s*GGML_TYPE_IQ2_S)",
                  "                if (table_id == MMVQ_PARAMETERS_PASCAL) {\n"
                  "                    switch (type) {\n"
                  "                        case GGML_TYPE_Q4_0:\n"
                  "                        case GGML_TYPE_Q4_1:\n"
                  "                        case GGML_TYPE_Q5_0:\n"
                  "                        case GGML_TYPE_Q5_1:\n"
                  "                        case GGML_TYPE_Q8_0:\n"
                  "                        case GGML_TYPE_Q4_K:\n"
                  "                        case GGML_TYPE_Q5_K:\n"
                  "                        case GGML_TYPE_Q6_K:\n"
                  "                        case GGML_TYPE_IQ4_NL:\n"
                  "                            return 4;\n"
                  "                        default:\n"
                  "                            return 2;\n"
                  "                    }\n"
                  "                }\n" + r"\1",
                  "mmvq calc_rows_per_block pascal"
              )
              with open(mmvq_path, "w", encoding="utf-8", newline="") as f:
                  f.write(mmvq_new)
              print(f"[P100 Patch] Successfully patched {mmvq_path}.")
              print("".join(difflib.unified_diff(mmvq_orig.splitlines(True), mmvq_new.splitlines(True), fromfile=mmvq_path, tofile=mmvq_path)))

          # 3. koboldcpp.py: allow AVX1-only CPUs (no AVX2) to auto-select CUDA in GUI & CLI
          kcpp_path = "koboldcpp.py"
          with open(kcpp_path, "r", encoding="utf-8", newline="") as f:
              kcpp_orig = f.read()

          if "eligible_cuda = (cpusupport<2) # P100 no-AVX2 build" in kcpp_orig:
              print(f"[P100 Patch] {kcpp_path} already patched, skipping.")
          else:
              kcpp_new = apply_exact_sub(
                  kcpp_path,
                  kcpp_orig,
                  r"eligible_cuda\s*=\s*\(\s*cpusupport\s*<\s*1\s+and\s+not\s+is_oldpc_ver\s*\)\s+or\s+\(\s*cpusupport\s*<\s*2\s+and\s+is_oldpc_ver\s*\)",
                  "eligible_cuda = (cpusupport<2) # P100 no-AVX2 build",
                  "koboldcpp.py eligible_cuda",
                  expected=2
              )
              with open(kcpp_path, "w", encoding="utf-8", newline="") as f:
                  f.write(kcpp_new)
              print(f"[P100 Patch] Successfully patched {kcpp_path}.")
              print("".join(difflib.unified_diff(kcpp_orig.splitlines(True), kcpp_new.splitlines(True), fromfile=kcpp_path, tofile=kcpp_path)))

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter==5.2.0 pyinstaller==5.12.0 psutil==5.9.5 jinja2==3.1.6

      - name: Display full Visual Studio info Before
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json
        shell: pwsh

      - name: Visual Studio 2019 Reinstall
        shell: cmd
        run: |
          @echo off
          echo Preparing setup
          curl -fLO https://download.visualstudio.microsoft.com/download/pr/1fbe074b-8ae1-4e9b-8e83-d1ce4200c9d1/61098e228df7ba3a6a8b4e920a415ad8878d386de6dd0f23f194fe1a55db189a/vs_Enterprise.exe
          vs_Enterprise.exe --quiet --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.CLI.Support --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --add Microsoft.VisualStudio.Workload.UniversalBuildTools --add Microsoft.VisualStudio.Component.VC.CMake.Project
          echo Waiting for VS2019 setup
          set "ProcessName=setup.exe"
          :CheckProcess
          tasklist /FI "IMAGENAME eq %ProcessName%" | find /I "%ProcessName%" >nul
          if %errorlevel%==0 (
            ping 127.0.0.1 /n 5 >nul
            goto CheckProcess
          )
          echo VS2019 Setup completed
          exit /b 0

      - uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.1.0'
          use-github-cache: false

      - name: Disable Visual Studio 2022 by Renaming
        run: |
          Rename-Item "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" "Enterprise_DISABLED"
        shell: pwsh

      - name: Display full Visual Studio info After
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json
        shell: pwsh

      - name: Download and install win64devkit
        run: |
          curl -L https://github.com/skeeto/w64devkit/releases/download/v1.22.0/w64devkit-1.22.0.zip --output w64devkit.zip
          Expand-Archive w64devkit.zip -DestinationPath .

      - name: Add w64devkit to PATH
        run: |
          echo "$(Get-Location)\w64devkit\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build Non-CUDA
        id: make_build
        run: |
          make LLAMA_VULKAN=1 LLAMA_PORTABLE=1 -j ${env:NUMBER_OF_PROCESSORS} LLAMA_NOAVX2=1

      - name: Build CUDA
        id: cmake_build
        env:
          KCPP_CUDA_ROOT: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: |
          cmake -S . -B build -G "Visual Studio 16 2019" -A x64 -T "cuda=$env:KCPP_CUDA_ROOT" "-DCUDAToolkit_ROOT=$env:KCPP_CUDA_ROOT" "-DKCPP_CUDA_EXPECTED_VERSION=12.1" -DLLAMA_CUBLAS=ON -DLLAMA_AVX=ON -DLLAMA_AVX2=OFF -DLLAMA_FMA=OFF -DCMAKE_CUDA_ARCHITECTURES="60-real" -DCMAKE_SYSTEM_VERSION="10.0.19041.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy CuBLAS Libraries
        env:
          KCPP_CUDA_ROOT: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: |
          Copy-Item -LiteralPath (Join-Path $env:KCPP_CUDA_ROOT "bin\cublasLt64_12.dll") -Destination . -Force -ErrorAction Stop
          Copy-Item -LiteralPath (Join-Path $env:KCPP_CUDA_ROOT "bin\cublas64_12.dll") -Destination . -Force -ErrorAction Stop
          ls

      - name: Package PyInstallers
        id: make_pyinstaller
        run: |
          ./make_pyinstaller_cuda.bat

      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: kcpp_windows_pyinstallers
          path: dist/
